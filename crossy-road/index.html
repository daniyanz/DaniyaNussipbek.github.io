<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossy Road</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
      <h1>🐔 Crossy Road</h1>
      <p>Hop across roads and rivers without getting hit!</p>
      <div class="controls-info">
        <div>⬆️ / W — Move Forward</div>
        <div>⬇️ / S — Move Back</div>
        <div>⬅️ / A — Move Left</div>
        <div>➡️ / D — Move Right</div>
      </div>
      <button id="startBtn">Start Game</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="overlay hidden">
      <h1>Game Over</h1>
      <p id="final-score">Score: 0</p>
      <p id="high-score-display">Best: 0</p>
      <button id="restartBtn">Play Again</button>
    </div>

    <!-- HUD -->
    <div id="hud">
      <span id="score-display">Score: 0</span>
      <span id="best-display">Best: 0</span>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
